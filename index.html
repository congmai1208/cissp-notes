const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
  return new TextDecoder().decode(buf);
}
async function open(pw, remember){
  const msg = document.getElementById('msg'), btn = document.getElementById('go');
  msg.textContent = ''; btn.disabled = true; btn.textContent = 'Đang mở…';
  try{
    const html = await unlock(pw);
    try{ remember ? localStorage.setItem('cissp_pw', pw) : localStorage.removeItem('cissp_pw'); }catch(e){}
    document.open(); document.write(html); document.close();
  }catch(e){
    msg.textContent = 'Sai mật khẩu hoặc trình duyệt không hỗ trợ.';
    try{ localStorage.removeItem('cissp_pw'); }catch(_){}
    btn.disabled = false; btn.textContent = 'Mở';
  }
}
document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  open(document.getElementById('pw').value, document.getElementById('rem').checked);
});
if(!window.crypto || !crypto.subtle){
  document.getElementById('msg').textContent = 'Cần mở bằng https (không dùng được với file cục bộ).';
}else{
  let saved = null; try{ saved = localStorage.getItem('cissp_pw'); }catch(e){}
  if(saved) open(saved, true);
}
